<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Amor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Audio que se reproducirá al entrar -->
    <audio id="audio" src="imagenes/audio.mp3"></audio>

    <!-- Canvas para globos -->
    <canvas id="canvas-globos"></canvas>

    <h1>🎉 Feliz Cumpleaños Amor 🎉</h1>
    <p>Hoy celebramos tu vida, tu luz y todo lo que eres para mí.</p>

    <!-- Pastel -->
    <img src="imagenes/pastel.png" alt="Pastel de cumpleaños" class="pastel">

    <!-- Sección regalo -->
    <div class="regalo-section">
        <h2>Tu regalo especial 🎁</h2>
        <p>Haz clic en la bolsa para descubrir tu sorpresa...</p>

        <img src="imagenes/regalo.png" alt="Bolsa de regalo" class="regalo-img" id="regalo">

        <!-- Boletos -->
        <div id="boletos" class="boletos-container"></div>

        <!-- Mensaje cine -->
        <div id="mensaje-cine" class="mensaje-cine"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
