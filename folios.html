<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Boletos Amor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎬 Tu cita en el cine</h1>

        <p class="mensaje">
            Tienes una cita en el cine para el próximo fin de semana ❤️
        </p>

        <!-- Botón para reproducir audio -->
        <button id="btnAudio" class="btn-audio">🔊 Reproducir audio</button>

        <audio id="audio" src="imagenes/audio.mp3"></audio>

        <script>
            document.getElementById("btnAudio").addEventListener("click", () => {
                const audio = document.getElementById("audio");
                audio.volume = 0.7;
                audio.play();
            });
        </script>

        <h2 class="subtitulo">Cómo cambiar tus folios en Cinépolis</h2>
        <img src="imagenes/cine.png" class="cine-img-small">

        <div class="tickets">

            <div class="ticket">
                <h3>Cinépolis</h3>
                <p>Folio: (folio 1)</p>
                <p>Válido en taquilla</p>
            </div>

            <div class="ticket">
                <h3>Cinépolis</h3>
                <p>Folio: (folio 2)</p>
                <p>Válido en taquilla</p>
            </div>

            <div class="ticket">
                <h3>Cinépolis</h3>
                <p>Folio: (folio 3)</p>
                <p>Válido en taquilla</p>
            </div>

        </div>

    </div>

</body>
</html>
